{{ define "main" }}
<div class="container" style="max-width: 900px; margin: 60px auto; padding: 0 20px;">
  <article style="background: #ffffff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
    
    <header style="text-align: center; border-bottom: 1px solid #e9ecef; margin-bottom: 30px; padding-bottom: 20px;">
      <h1 style="font-size: 2.5rem; color: #212529; font-weight: 800; margin: 0;">{{ .Title }}</h1>
    </header>

    <div class="post-content" style="line-height: 1.8; color: #475569; font-size: 1.05rem;">
      {{/* Ini adalah tag ajaib Hugo yang akan memanggil seluruh tulisan Markdown Anda */}}
      {{ .Content }}
    </div>
    
  </article>
</div>
{{ end }}
