baseURL = 'https://pepuru.com/'
locale = "id-id"
defaultContentLanguage = "id"
defaultContentLang = "id"
title = 'Daddy Ananta'
enableRobotsTXT = true
tableOfContents = true

pagination.pagerSize = 12

[sitemap]
  changeFreq = ''
  disable = false
  filename = 'sitemap.xml'
  priority = -1

[params]
    description = "Analisis mendalam perilaku konsumen menggunakan data untuk mengungkap pola pembelian, preferensi, dan motivasi yang mendasari keputusan. Identifikasi tren konsumsi, segmentasi pasar efektif, dan pemetaan perjalanan pelanggan melalui pengolahan data transaksi, interaksi digital, serta sumber relevan lainnya. Penerjemahan data kompleks menjadi insight actionable melalui visualisasi yang jelas, mendukung perancangan strategi pemasaran, pengembangan produk, dan peningkatan pengalaman pelanggan yang berpusat pada data konsumen."
    dateFormat= "2 January 2006"
    goatcounter = "lamtiarsigiro"
    math = true
    ShowPageViews = true
    mermaid = true

[params.social.share]
    facebook = true
    linkedin = true
    twitter = true
    whatsapp = true
    email = true

[taxonomies]
    category = "categories"
    author = "authors"
    tag = "tags"

[markup.goldmark.renderer]
  unsafe = true
  
[caches]
  [caches.images]
    dir = ':cacheDir/images'

[related]
  threshold = 80
  includeNewer = true
  toLower = false
  [[related.indices]]
    name = "categories"
    weight = 100 
  [[related.indices]]
    name = "tags"
    weight = 80  
  [[related.indices]]
    name = "date"
    weight = 10

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]
  
  [markup.tableOfContents]
    startLevel = 2
    ordered = false
    endLevel = 4

[[menu.main]]
    name = "About Me"
    url = "/about/"
    weight = 1

[outputs]
  home = ["HTML", "RSS", "JSON", "SITEMAP"]
  page = ["HTML"]
  section = ["HTML", "RSS", "SITEMAP"]
  taxonomy = ["HTML", "RSS", "SITEMAP"]
  term = ["HTML", "SITEMAP"]

[outputFormats.HTML]
  mediaType = "text/html"
  baseName = "index"
  isPlainText = false
  rel = "canonical"
  noUglyURLs = true
  gzip = true
  minify = true
  [[outputFormats.HTML.headers]]
        cache-control = "public, max-age=7200, no-cache, must-revalidate" # 2 jam, dengan validasi
    


[outputFormats.CSS]
    mediaType = "text/css"
    baseName = "style"
    isPlainText = false
    gzip = true
    minify = true
    [[outputFormats.CSS.headers]]
        cache-control = "public, max-age=31536000, immutable" # 1 Tahun untuk CSS
